<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Register - GoldKitty Bank</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-hover: #F9E076;
            --dark-bg: #0f0f0f;
            --glass-white: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            /* Different radial position for the register page to differentiate from login */
            background-image:
                radial-gradient(circle at 100% 0%, rgba(212, 175, 55, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(212, 175, 55, 0.08) 0%, transparent 40%);
            color: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar-custom {
            background-color: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 2.5rem;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--gold-primary) !important;
            text-transform: uppercase;
        }

        .social-icons a {
            color: rgba(255, 255, 255, 0.5);
            margin-left: 20px;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-icons a:hover {
            color: var(--gold-primary);
            transform: scale(1.1);
        }

        /* Register Card */
        .register-card {
            width: 100%;
            max-width: 420px;
            padding: 45px;
            background: var(--glass-white);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .register-card h2 {
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .register-card p.subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* Form Controls */
        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gold-primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            height: 52px;
            border-radius: 14px;
            padding: 10px 18px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            color: #ffffff;
        }

        .btn-register {
            background-color: var(--gold-primary);
            color: #000;
            font-weight: 600;
            height: 52px;
            border-radius: 14px;
            border: none;
            margin-top: 15px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            background-color: var(--gold-hover);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(212, 175, 55, 0.25);
        }

        .custom-link {
            color: var(--gold-primary);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s;
        }

        .custom-link:hover {
            color: var(--gold-hover);
            text-decoration: underline;
        }

        .alert-error {
            background: rgba(255, 76, 76, 0.08);
            border: 1px solid rgba(255, 76, 76, 0.2);
            color: #ff6b6b;
            border-radius: 12px;
            font-size: 0.85rem;
            padding: 12px;
        }

        .footer {
            background: transparent;
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            position: fixed;
            bottom: 25px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/landing">GoldKitty Bank</a>
            <div class="ml-auto social-icons">
                <a href="https://www.youtube.com" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </nav>

    <div class="register-card text-center">
        <h2>Join the Elite</h2>
        <p class="subtitle">Open your GoldKitty account in seconds.</p>

        <form method="post" action="/register">
            <div class="form-group">
                <label>Choose Username</label>
                <input type="text" class="form-control" name="username" placeholder="e.g. GoldKitty_user" required />
            </div>
            <div class="form-group">
                <label>Security Password</label>
                <input type="password" class="form-control" name="password" placeholder="Min. 8 characters" required />
            </div>
            <button type="submit" class="btn btn-block btn-register">Create Free Account</button>
        </form>

        <p class="mt-4 mb-0" style="font-size: 0.9rem; color: rgba(255,255,255,0.6);">
            Already a member? <a href="/login" class="custom-link">Sign In</a>
        </p>

        <div th:if="${error}" class="alert alert-error mt-4">
            <i class="fas fa-exclamation-circle mr-1"></i> This username is already taken.
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 GoldKitty International. All Rights Reserved. | <a href="#" class="custom-link"
                style="font-weight: 400; opacity: 0.7;">Security</a></p>
    </footer>

</body>

</html>
